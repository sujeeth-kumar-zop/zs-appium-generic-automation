name: iOS Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  iOS-tests:
    runs-on: macos-12

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Checkout the project
        uses: actions/checkout@v3

      - name: Setup Appium
        run: |
          npm install -g appium@2.19
          appium -v
          nohup appium > /dev/null 2>&1 &

      - name: Run iOS tests
        run: cd mobile-automation && mvn clean test
