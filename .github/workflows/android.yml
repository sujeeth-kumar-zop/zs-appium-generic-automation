name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-tests:
    runs-on: macos-13

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Checkout the project
        uses: actions/checkout@v3

      - name: Setup Appium
        run: |
          npm install -g appium@next
          appium -v
          appium driver install uiautomator2
          appium driver list --installed
          nohup appium > /dev/null 2>&1 &
    

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: mvn clean test -Dplatform=android -DAndroidBuildPath=mobile-automation/apks/Hamburger-testtag.apk

