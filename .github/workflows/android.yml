name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout the project
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Copy APK to test location
        run: |
          mkdir -p src/test/resources/builds/
          mkdir -p mobile-automation/src/test/resources/builds/
          find . -name "app-debug.apk" -exec cp {} src/test/resources/builds/Hamburger-testtag.apk \;
          find . -name "app-debug.apk" -exec cp {} mobile-automation/src/test/resources/builds/Hamburger-testtag.apk \;

      - name: Setup Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium &
          sleep 5

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: cd mobile-automation && mvn clean test