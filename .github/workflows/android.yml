name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout the project
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Run emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            echo "Restarting ADB..."
            adb kill-server
            adb start-server
            adb wait-for-device
            adb devices
            echo "Installing and starting Appium..."
            npm install -g appium
            appium driver install uiautomator2
            appium &
            sleep 15
            echo "Running tests..."
            cd mobile-automation && mvn clean test