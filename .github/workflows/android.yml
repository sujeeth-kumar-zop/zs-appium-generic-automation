name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-tests:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set APK path
        run: |
          APK_PATH="$(pwd)/mobile-automation/src/test/resources/builds/Hamburger-testtag.apk"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'

      - name: Setup Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          nohup appium > appium.log 2>&1 &
          sleep 10

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: cd mobile-automation && mvn clean test
        env:
          APK_PATH: ${{ env.APK_PATH }}