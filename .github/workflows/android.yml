name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-tests:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Setup APK
        run: |
          # Copy APK to expected location
          mkdir -p mobile-automation/src/test/resources/builds/
          cp Hamburger-testtag.apk mobile-automation/src/test/resources/builds/
          APK_PATH="$(pwd)/mobile-automation/src/test/resources/builds/Hamburger-testtag.apk"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'

      - name: Setup Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          nohup appium > appium.log 2>&1 &
          sleep 10

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: |
            echo "APK: $APK_PATH"
            cd mobile-automation && mvn clean test -X
        env:
          APK_PATH: ${{ env.APK_PATH }}